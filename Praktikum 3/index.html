<html>
<head>
    <title>Tugas Praktikum - Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Selamat Datang di Website Cihuyy</h1>
        <nav>
            <a href="#">Beranda</a>
            <a href="#">Tentang</a>
            <a href="#">Layanan</a>
            <a href="#">Kontak</a>
        </nav>
    </header>

    <div class="container">
        <main class="main-content">
            <h2>Formulir Pendaftaran</h2>
            <p>Silakan isi formulir di bawah ini untuk mendaftar.</p>
            <hr>

            <form action="#">
                <div class="form-group">
                    <label>Nama Lengkap:</label>
                    <input type="text" name="nama">
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email">
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password">
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin:</label>
                    <div class="radio-group">
                        <input type="radio" name="gender" id="laki"> <label for="laki">Laki-laki</label><br>
                        <input type="radio" name="gender" id="perempuan"> <label for="perempuan">Perempuan</label>
                    </div>
                </div>
                <hr>

                <div class="form-group">
                    <label>Hobi:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" name="hobi" id="musik"> <label for="musik">Musik</label><br>
                        <input type="checkbox" name="hobi" id="olahraga"> <label for="olahraga">Olahraga</label><br>
                        <input type="checkbox" name="hobi" id="membaca"> <label for="membaca">Membaca</label>
                    </div>
                </div>
                <hr>

                <div class="form-group">
                    <label>Pilih Kota:</label>
                    <select name="kota">
                        <option value="jakarta">Jakarta</option>
                        <option value="bandung">Bandung</option>
                        <option value="surabaya">Surabaya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Pesan Tambahan:</label>
                    <textarea name="pesan" placeholder="Tulis pesan di sini..."></textarea>
                </div>

                <button type="submit" class="btn-kirim">Kirim</button>
            </form>
        </main>

        <aside class="sidebar">
            <h3>Sidebar</h3>
            <p>Bagian sidebar dapat berisi tautan, iklan, atau informasi tambahan.</p>
        </aside>
    </div>

</body>
</html>
