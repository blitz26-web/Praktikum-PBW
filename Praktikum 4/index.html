<html>
<head>
    <title>Cek Nilai Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Program Cek Nilai</h2>
        
        <div class="form-group">
            <label for="nim">NIM (Nomor Induk Mahasiswa):</label>
            <input type="text" id="nim" placeholder="Masukkan NIM">
        </div>

        <div class="form-group">
            <label for="nilai">Nilai Mata Kuliah:</label>
            <input type="number" id="nilai" placeholder="0 - 100">
        </div>

        <button onclick="cekNilai()">Cek Nilai</button>

        <div id="hasil" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
